{% set specialists = teachers | selectattr('category', 'equalto', teacher_category) | list %}
{% if specialists %}
<section class="pl-section">
    <h2 class="pl-h2 pl-h2--md">Педагоги и специалисты</h2>
    <div class="pl-teachers pl-teachers--equal">
        {% for teacher in specialists %}
        <article class="pl-teacher">
            <img src="{{ teacher.photo_url }}" alt="{{ teacher.name }}" loading="lazy" style="display:block;width:100%;height:320px;object-fit:cover;object-position:center 25%;">
            <div class="pl-teacher-body">
                <h3>{{ teacher.name }}</h3>
                <p class="pl-teacher-role">{{ teacher.role }}</p>
            </div>
        </article>
        {% endfor %}
    </div>
</section>
{% endif %}
