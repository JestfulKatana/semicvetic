<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Семицветик</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo-flower.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="login-page">
    <section class="login-card">
        <a class="brand" href="/"><img src="{{ url_for('static', filename='img/logo-flower.png') }}" width="44" height="44" alt="">Семицветик</a>
        <h1>Вход на сайт</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="post" class="stack-md">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>
                Логин
                <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </label>
            <label>
                Пароль
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button class="button button-primary" type="submit">Войти</button>
        </form>
    </section>
</body>
</html>
