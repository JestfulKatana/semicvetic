{% extends 'version/base.html' %}{% block content %}<section class="section login-section"><p class="eyebrow">Для команды центра</p><h1>Вход на сайт</h1><form method="post" class="inquiry-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="form-status error" role="alert">{{ message }}</p>{% endfor %}{% endwith %}<label>Логин<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Войти ↗</button></form></section>{% endblock %}
