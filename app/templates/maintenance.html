<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>Семицветик — обновляем сайт</title>
    <meta name="description" content="Ведётся разработка нового сайта детского центра «Семицветик». Скоро вернёмся.">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-flower.png') }}">
    <style>
        :root {
            color-scheme: light;
            font-family: "Onest", "Segoe UI", Arial, sans-serif;
            color: #24382f;
            background: #f8f6ee;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 205, 92, .42) 0 8%, transparent 24%),
                radial-gradient(circle at 92% 8%, rgba(119, 205, 181, .36) 0 9%, transparent 27%),
                linear-gradient(135deg, #fffdf6 0%, #f7f2e3 100%);
        }

        main {
            position: relative;
            isolation: isolate;
            display: grid;
            place-items: center;
            min-height: 100vh;
            min-height: 100svh;
            padding: clamp(20px, 4vw, 64px);
        }

        .petal {
            position: absolute;
            z-index: -1;
            width: clamp(54px, 8vw, 112px);
            aspect-ratio: 1;
            border-radius: 75% 20% 70% 30%;
            opacity: .78;
            filter: blur(.2px);
            animation: drift 8s ease-in-out infinite alternate;
        }

        .petal-one { top: 7%; left: 5%; background: #f4c44f; transform: rotate(24deg); }
        .petal-two { right: 5%; bottom: 8%; background: #79c9b1; transform: rotate(205deg); animation-delay: -2s; }
        .petal-three { right: 12%; top: 13%; width: clamp(34px, 5vw, 72px); background: #f28e85; transform: rotate(115deg); animation-delay: -5s; }

        .panel {
            width: min(1180px, 100%);
            min-height: min(700px, calc(100svh - 80px));
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(340px, .95fr);
            align-items: center;
            overflow: hidden;
            border: 1px solid rgba(41, 86, 66, .1);
            border-radius: clamp(28px, 5vw, 56px);
            background: rgba(255, 255, 255, .82);
            box-shadow: 0 30px 80px rgba(58, 79, 66, .16);
            backdrop-filter: blur(14px);
        }

        .copy {
            padding: clamp(38px, 7vw, 96px);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: clamp(34px, 7vw, 86px);
            color: #315c48;
            font-size: clamp(18px, 2vw, 24px);
            font-weight: 800;
        }

        .brand img { width: 52px; height: 52px; }

        .eyebrow {
            display: inline-block;
            margin: 0 0 18px;
            padding: 9px 14px;
            border-radius: 999px;
            background: #e8f5ef;
            color: #287354;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 720px;
            margin: 0;
            font-size: clamp(42px, 6.4vw, 82px);
            line-height: .98;
            letter-spacing: -.055em;
            text-wrap: balance;
        }

        .message {
            max-width: 600px;
            margin: 28px 0 0;
            color: #617067;
            font-size: clamp(18px, 2vw, 23px);
            line-height: 1.55;
            text-wrap: pretty;
        }

        .visual {
            align-self: stretch;
            position: relative;
            display: grid;
            align-items: end;
            justify-items: center;
            min-height: 560px;
            padding: 40px 20px 0;
            background:
                radial-gradient(circle at 50% 70%, rgba(255, 216, 114, .78) 0 18%, transparent 47%),
                linear-gradient(160deg, #ddf2e8 0%, #f9e3d5 100%);
        }

        .visual::before {
            content: "";
            position: absolute;
            right: 10%;
            top: 10%;
            width: 86px;
            aspect-ratio: 1;
            border: 15px solid rgba(255, 255, 255, .72);
            border-radius: 50%;
        }

        .visual img {
            position: relative;
            z-index: 1;
            display: block;
            width: min(100%, 530px);
            max-height: 670px;
            object-fit: contain;
            object-position: bottom center;
            filter: drop-shadow(0 24px 30px rgba(80, 65, 47, .16));
        }

        .status {
            position: absolute;
            z-index: 2;
            right: clamp(18px, 5vw, 48px);
            bottom: clamp(18px, 4vw, 40px);
            margin: 0;
            padding: 12px 16px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 30px rgba(61, 72, 65, .18);
            color: #315c48;
            font-size: 14px;
            font-weight: 800;
        }

        @keyframes drift {
            to { translate: 0 18px; rotate: 8deg; }
        }

        @media (max-width: 820px) {
            main { padding: 14px; }
            .panel { grid-template-columns: 1fr; min-height: calc(100svh - 28px); }
            .copy { padding: 32px 28px 18px; }
            .brand { margin-bottom: 32px; }
            h1 { font-size: clamp(42px, 13vw, 68px); }
            .message { margin-top: 20px; }
            .visual { min-height: 390px; padding-top: 16px; }
            .visual img { width: min(86%, 390px); max-height: 460px; }
        }

        @media (max-width: 480px) {
            .panel { border-radius: 30px; }
            .copy { padding: 28px 22px 10px; }
            .brand img { width: 42px; height: 42px; }
            .eyebrow { font-size: 12px; }
            .message { font-size: 17px; }
            .visual { min-height: 345px; }
            .visual img { max-height: 350px; }
            .status { right: 14px; bottom: 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .petal { animation: none; }
        }
    </style>
</head>
<body>
    <main>
        <span class="petal petal-one" aria-hidden="true"></span>
        <span class="petal petal-two" aria-hidden="true"></span>
        <span class="petal petal-three" aria-hidden="true"></span>
        <section class="panel" aria-labelledby="maintenance-title">
            <div class="copy">
                <div class="brand">
                    <img src="{{ url_for('static', filename='img/logo-flower.png') }}" width="52" height="52" alt="">
                    <span>Семицветик</span>
                </div>
                <p class="eyebrow">Большое обновление</p>
                <h1 id="maintenance-title">Ведётся разработка нового сайта</h1>
                <p class="message">Мы готовим новую версию «Семицветика» — яркую, удобную и полезную. Совсем скоро вернёмся.</p>
            </div>
            <div class="visual" aria-hidden="true">
                <img src="{{ url_for('static', filename='img/maintenance-shiba.webp') }}" width="900" height="1350" alt="">
                <p class="status">Сиба следит за ремонтом</p>
            </div>
        </section>
    </main>
</body>
</html>
