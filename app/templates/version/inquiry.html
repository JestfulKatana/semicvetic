<section class="inquiry section" id="inquiry"><div class="inquiry-copy"><h2>С чего начнётся<br> ваша история?</h2><p>Расскажите, какое занятие ищете. Администратор поможет с выбором и уточнит детали посещения.</p>{% if site_settings.get('phone_1') %}<a class="text-phone" href="tel:{{ site_settings.phone_1|replace(' ','')|replace('(','')|replace(')','')|replace('-','') }}">{{ site_settings.phone_1 }}</a><small>Если удобнее поговорить сразу</small>{% endif %}</div>
<form class="inquiry-form" method="post" action="/api/lead" data-inquiry><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="source_page" value="{{ request.path }}"><input type="hidden" name="source_block" value="version-inquiry"><div class="honeypot" aria-hidden="true"><label>Компания<input name="company" tabindex="-1" autocomplete="off"></label></div>
<div class="form-grid"><label>Как к вам обращаться<input name="name" autocomplete="given-name" maxlength="120" placeholder="Ваше имя"></label><label><span>Телефон <span aria-hidden="true">*</span></span><input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+7 (___) ___-__-__" required maxlength="32" aria-describedby="phone-help"><span class="field-help" id="phone-help">Российский номер, начиная с +7 или 8.</span></label></div>
<label>Что вас интересует<select name="program_slug" id="inquiry-program"><option value="">Помогите выбрать занятие</option>{% for p in programs %}<option value="{{ p.slug }}" {% if selected_program==p.slug %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></label>
<div class="form-grid"><label>Возраст ребёнка <span class="optional">необязательно</span><input name="child_age" maxlength="50" placeholder="Например, 5 лет"></label><label>Когда удобно связаться <span class="optional">необязательно</span><input name="preference" maxlength="500" placeholder="Например, вечером"></label></div>
<label class="consent"><input type="checkbox" name="consent" value="on" required><span>Согласен на обработку указанных данных для ответа на обращение. <a href="/privacy-policy/">Подробнее о данных заявки</a>.</span></label><button class="btn" type="submit">Отправить заявку <span aria-hidden="true">↗</span></button><p class="form-status" role="status" aria-live="polite" tabindex="-1"></p><p class="form-note">Это обращение в центр, а не подтверждение записи на занятие.</p></form></section>
